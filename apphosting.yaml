runConfig:
  maxInstances: 1
  minInstances: 0
  concurrency: 80
  cpu: 1
  memoryMiB: 512

scripts:
  buildCommand: npm run build
  runCommand: node server.mjs

outputFiles:
  serverApp:
    include:
      - dist
      - server.mjs
      - package.json
      - node_modules

# Firebase environment variables for the build process
# These are public keys (exposed to the browser by design), safe to store here.
